# Makes `research/` its own pnpm root, apart from the repo's, so its libraries
# never enter the published package's lockfile.
#
# - Both settings mirror the root `pnpm-workspace.yaml`; keep them in sync.

# core-js-pure's install script only prints a funding message.
allowBuilds:
  core-js-pure: false

# Supply-chain floor: refuse any version younger than 7 days (in minutes).
minimumReleaseAge: 10080

# Write exact versions on `pnpm add`, so the lockfile is the only thing that
# moves a dependency.
saveExact: true
minimumReleaseAgeExclude:
  # Renovate security update: decode-uri-component@0.5.1
  - decode-uri-component@0.5.1
