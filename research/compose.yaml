# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/main/schema/compose-spec.json

# Every tool the comparison harness runs, driven by `pnpm research`
# (`scripts/research/run.ts`).
#
# - Adapters run once and exit (`docker compose run --rm`); each prints its
#   columns as JSON on stdout and writes nothing.
#
# - Each service sits in a profile per batch, so a run pulls only what it
#   needs; the `role` label tells the runner an adapter from a formatter.
#
# - Every image is pinned by version and digest, and bumped by Dependabot.
#
# - The repo is mounted read-only under `/work`, mirroring its layout, so an
#   adapter's relative imports resolve.
#
# - No service has a network (`network_mode: none`): everything is installed
#   at build time, so a run is hermetic, and parallel runs never race to create
#   a shared one. A service that needs another (a database) joins a network
#   of its own.

name: safe-fns-research

x-adapter-environment: &adapter-environment
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  TZ: UTC

x-adapter-volumes: &adapter-volumes
  - ./adapters:/work/research/adapters:ro
  - ./cases:/work/research/cases:ro

# Debian's shells, git, systemd, and clang-format, from one image.
x-debian-build: &debian-build
  context: .
  dockerfile: docker/debian/Dockerfile

# A compiled adapter's image: its build context is its own directory, so the
# image copies only that adapter, and `.dockerignore` (the Node image's) never
# applies. The language's formatter and linter run on the same image.
x-dotnet-build: &dotnet-build
  context: adapters/dotnet
  dockerfile: ../../docker/dotnet/Dockerfile

x-go-build: &go-build
  context: adapters/go
  dockerfile: ../../docker/go/Dockerfile

# PowerShell, plus PSScriptAnalyzer for its formatter.
x-powershell-build: &powershell-build
  context: docker/powershell

x-python-volumes: &python-volumes
  - ./adapters:/work/research/adapters:ro
  - ./cases:/work/research/cases:ro

# Ruby, plus Rails' ActiveModel and syntax_tree from `Gemfile.lock`.
x-ruby-build: &ruby-build
  context: docker/ruby

x-rust-build: &rust-build
  context: adapters/rust
  dockerfile: ../../docker/rust/Dockerfile

services:
  # glibc through `ctypes`, and libstdc++ through probes compiled at startup.
  c:
    entrypoint: ["python3", "/work/research/adapters/c.py"]
    environment: *adapter-environment
    image: gcc:16.1.0-trixie@sha256:d8dec2859f964120119abd1380563247bf02c5d64f5bcdea496dbace1f48c6f0
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["c"]
    volumes: *adapter-volumes

  # Checkstyle's `final` rules for the Java adapter (`adapters/jvm/
  # checkstyle.xml`); it only reports, so both modes check.
  #
  # - `pull_policy: build`, like `ktfmt`, so a version bump is never masked by
  #   a cached image.
  checkstyle:
    build:
      context: docker/checkstyle
    labels:
      dev.safe-fns.research.check-args: >-
        -c adapters/jvm/checkstyle.xml adapters/jvm/src
      dev.safe-fns.research.format-args: >-
        -c adapters/jvm/checkstyle.xml adapters/jvm/src
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    pull_policy: build
    volumes:
      - ./adapters:/work/research/adapters:ro
    working_dir: /work/research

  clang-format:
    build: *debian-build
    entrypoint: ["clang-format", "--style=LLVM"]
    labels:
      dev.safe-fns.research.check-args: --dry-run --Werror adapters/cxx_probes.cpp
      dev.safe-fns.research.format-args: -i adapters/cxx_probes.cpp
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    volumes:
      - ./adapters:/work/research/adapters
    working_dir: /work/research

  # Rust's linter, beside rustfmt. `--fix` exits 0 even when a denied lint
  # remains, so a fixing run (`--fix`) then checks like any other.
  #
  # - `pull_policy: build`, like every formatter built from a Dockerfile, so a
  #   version bump is never masked by a cached image.
  clippy:
    build: *rust-build
    entrypoint:
      - sh
      - -c
      - >-
        [ "$$1" != --fix ]
        || cargo clippy --locked --offline --quiet --fix --allow-no-vcs;
        exec cargo clippy --locked --offline --quiet -- --deny warnings
      - clippy
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.check-args: --check
      dev.safe-fns.research.format-args: --fix
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    pull_policy: build
    volumes:
      - ./adapters/rust:/work/research/adapters/rust

  csharpier:
    build: *dotnet-build
    entrypoint: ["dotnet", "csharpier"]
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.check-args: check .
      dev.safe-fns.research.format-args: format .
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    pull_policy: build
    volumes:
      - ./adapters/dotnet:/work/research/adapters/dotnet

  # The .NET base class library, under the invariant culture plus a column per
  # extra culture; the adapter is compiled into the image, not mounted.
  dotnet:
    build: *dotnet-build
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["dotnet"]
    volumes:
      - ./cases:/work/research/cases:ro

  # The .NET analyzers (`AnalysisLevel` in the project), which fail this build
  # on any warning; the build lands under `/tmp`, beside nothing it could
  # shadow.
  dotnet-build:
    build: *dotnet-build
    entrypoint:
      ["dotnet", "build", "--artifacts-path", "/tmp/research-artifacts"]
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.check-args: --verbosity quiet
      dev.safe-fns.research.format-args: --verbosity quiet
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    pull_policy: build
    volumes:
      - ./adapters/dotnet:/work/research/adapters/dotnet

  # Go's standard library; the adapter is compiled into the image, not
  # mounted.
  go:
    build: *go-build
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["go"]
    volumes:
      - ./cases:/work/research/cases:ro

  go-vet:
    build: *go-build
    entrypoint: ["go", "vet"]
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.check-args: .
      dev.safe-fns.research.format-args: .
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    pull_policy: build
    volumes:
      - ./adapters/go:/work/research/adapters/go

  # `gofmt -l` lists unformatted files but still exits 0, so any output fails.
  gofmt:
    build: *go-build
    entrypoint:
      - sh
      - -c
      - >-
        output=$$(gofmt "$$@") || exit;
        [ -z "$$output" ] || { echo "$$output"; exit 1; }
      - gofmt
    labels:
      dev.safe-fns.research.check-args: -l .
      dev.safe-fns.research.format-args: -w .
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    pull_policy: build
    volumes:
      - ./adapters/go:/work/research/adapters/go

  # CodeNarc's recommended rules through npm-groovy-lint, which formats too.
  # `--no-parse` skips its standalone compile, which can't see the Java and
  # Kotlin classes the Groovy files use.
  groovy-lint:
    image: nvuillam/npm-groovy-lint:v18.0.0@sha256:317deacf076dddf4329ac28cc73033aa137c781bfb035b2fb606edce8106836d
    labels:
      dev.safe-fns.research.check-args: >-
        --noserver --no-parse --failon info adapters/jvm
      dev.safe-fns.research.format-args: >-
        --noserver --no-parse --format --failon info adapters/jvm
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    volumes:
      - ./adapters:/work/research/adapters
    working_dir: /work/research

  # Java, Commons Lang, Guava, Spring, Kotlin, and Groovy in one JVM, so it
  # starts once per run; the adapter is compiled into the image, not mounted.
  jvm:
    build:
      context: adapters/jvm
      dockerfile: ../../docker/jvm/Dockerfile
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["jvm"]
    volumes:
      - ./cases:/work/research/cases:ro

  # ktfmt's Kotlin-lang style, at the 80 columns `.editorconfig` sets.
  #
  # - `pull_policy: build`, since `--format` runs it without the build step
  #   adapters get; a cached image would otherwise outlive a version bump.
  ktfmt:
    build:
      context: docker/ktfmt
    labels:
      dev.safe-fns.research.check-args: >-
        --kotlinlang-style --enable-editorconfig --dry-run --set-exit-if-changed
        adapters/jvm
      dev.safe-fns.research.format-args: >-
        --kotlinlang-style --enable-editorconfig adapters/jvm
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    pull_policy: build
    volumes:
      - ./adapters:/work/research/adapters
    working_dir: /work/research

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    entrypoint: ["node", "/work/research/adapters/node.mts"]
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["node"]
    volumes:
      - ./adapters:/work/research/adapters:ro
      - ./cases:/work/research/cases:ro
      - ../scripts/research:/work/scripts/research:ro
      - ../test:/work/test:ro

  php:
    entrypoint: ["php", "/work/research/adapters/php.php"]
    environment: *adapter-environment
    image: php:8.5.11-cli-bookworm@sha256:819080ed413631f6ec564184dd9acd08d9425bd863b9f8b5876b5ea2147d55e7
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["php"]
    volumes: *adapter-volumes

  # The .NET SDK image ships PowerShell; Microsoft no longer publishes
  # PowerShell's own image.
  powershell:
    build: *powershell-build
    entrypoint:
      - pwsh
      - -NoLogo
      - -NoProfile
      - -NonInteractive
      - -File
      - /work/research/adapters/powershell.ps1
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["powershell"]
    volumes: *adapter-volumes

  psscriptanalyzer:
    build: *powershell-build
    entrypoint:
      - pwsh
      - -NoLogo
      - -NoProfile
      - -NonInteractive
      - -File
      - /opt/research/format.ps1
    labels:
      dev.safe-fns.research.check-args: -Check adapters
      dev.safe-fns.research.format-args: adapters
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    volumes:
      - ./adapters:/work/research/adapters
    working_dir: /work/research

  python:
    entrypoint: ["python", "/work/research/adapters/python.py"]
    environment: *adapter-environment
    image: python:3.15.0rc3-slim-bookworm@sha256:ea93de1a70a03fffd10ad8cfde8f4ba969fe2658f0578af02855d1d32f49e6c2
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["python"]
    volumes: *python-volumes

  # The last Python with `distutils`, for `strtobool`; the setting makes it
  # the standard library's copy rather than the one setuptools injects.
  python311:
    entrypoint: ["python", "/work/research/adapters/python.py"]
    environment:
      <<: *adapter-environment
      SETUPTOOLS_USE_DISTUTILS: stdlib
    image: python:3.15.0rc3-slim-bookworm@sha256:ea93de1a70a03fffd10ad8cfde8f4ba969fe2658f0578af02855d1d32f49e6c2
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["python"]
    volumes: *python-volumes

  ruby:
    build: *ruby-build
    entrypoint: ["ruby", "/work/research/adapters/ruby.rb"]
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["ruby"]
    volumes: *adapter-volumes

  ruff:
    image: ghcr.io/astral-sh/ruff:0.17.0@sha256:0f9316141d252f8c4de3fb672e8433c1afbf9adb24b877ae887cffa4012d850c
    labels:
      dev.safe-fns.research.check-args: format --check adapters
      dev.safe-fns.research.format-args: format adapters
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    volumes:
      - ./adapters:/work/research/adapters
      - ./ruff.toml:/work/research/ruff.toml:ro
    working_dir: /work/research

  # Ruff's linter, beside its formatter: annotations, docstrings, and the
  # rest of `ruff.toml`'s rules.
  ruff-check:
    image: ghcr.io/astral-sh/ruff:0.17.0@sha256:0f9316141d252f8c4de3fb672e8433c1afbf9adb24b877ae887cffa4012d850c
    labels:
      dev.safe-fns.research.check-args: check adapters
      dev.safe-fns.research.format-args: check --fix adapters
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    volumes:
      - ./adapters:/work/research/adapters
      - ./ruff.toml:/work/research/ruff.toml:ro
    working_dir: /work/research

  # Rust's standard library, decoding through `serde_json`; the adapter is
  # compiled into the image, not mounted.
  rust:
    build: *rust-build
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["rust"]
    volumes:
      - ./cases:/work/research/cases:ro

  rustfmt:
    build: *rust-build
    entrypoint: ["cargo", "fmt"]
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.check-args: --all -- --check
      dev.safe-fns.research.format-args: --all
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    pull_policy: build
    volumes:
      - ./adapters/rust:/work/research/adapters/rust

  # bash, dash, fish, and zsh, plus git and systemd, driven from Python.
  shell:
    build: *debian-build
    entrypoint: ["python3", "/work/research/adapters/shell.py"]
    environment: *adapter-environment
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["shell"]
    volumes: *adapter-volumes

  sqlite:
    entrypoint: ["python", "/work/research/adapters/sqlite.py"]
    environment: *adapter-environment
    image: python:3.15.0rc3-slim-bookworm@sha256:ea93de1a70a03fffd10ad8cfde8f4ba969fe2658f0578af02855d1d32f49e6c2
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["python"]
    volumes: *python-volumes

  # Swift on Linux, whose Foundation is swift-corelibs-foundation rather than
  # Darwin's; the adapter compiles at startup, since the repo is read-only.
  swift:
    entrypoint:
      - sh
      - -c
      - >-
        swiftc -parse-as-library -O -o /tmp/swift-adapter
        /work/research/adapters/research_codec.swift
        /work/research/adapters/swift.swift
        && exec /tmp/swift-adapter "$$@"
      - swift
    environment: *adapter-environment
    image: swift:6.4.0-bookworm@sha256:7dac8560dab0523028235ce7aa79e59fdc68b861c6aca6c709f57c3187dd7f66
    labels:
      dev.safe-fns.research.role: adapter
    network_mode: none
    profiles: ["swift"]
    volumes: *adapter-volumes

  swift-format:
    entrypoint: ["swift", "format"]
    image: swift:6.4.0-bookworm@sha256:7dac8560dab0523028235ce7aa79e59fdc68b861c6aca6c709f57c3187dd7f66
    labels:
      dev.safe-fns.research.check-args: lint --strict --recursive adapters
      dev.safe-fns.research.format-args: format --in-place --recursive adapters
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    volumes:
      - ./.swift-format:/work/research/.swift-format:ro
      - ./adapters:/work/research/adapters
    working_dir: /work/research

  syntax-tree:
    build: *ruby-build
    entrypoint: ["stree"]
    labels:
      dev.safe-fns.research.check-args: check adapters/*.rb
      dev.safe-fns.research.format-args: write adapters/*.rb
      dev.safe-fns.research.role: formatter
    network_mode: none
    profiles: ["format"]
    volumes:
      - ./adapters:/work/research/adapters
    working_dir: /work/research
