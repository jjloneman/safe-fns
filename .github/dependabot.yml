# Weekly dependency updates that flow through the standard CI workflow.
#
# - Labels are applied by exact name, so the emoji-prefixed ones are spelled out
#   in full; a misspelled label is silently skipped.
#
# - Commit prefixes follow AGENTS.md's dependency-bump format. Dependabot always
#   says "bump", so a subject reads `chore(deps): ⬆️ bump foo from 1.0.0 to
#   1.0.1`.

# - Each entry repeats its schedule, assignee, and cooldown: Dependabot's parser
#   rejects YAML anchors and aliases ("YAML aliases are not supported"), so they
#   can't be shared.

version: 2
updates:
  - package-ecosystem: "github-actions"

    # The root covers `.github/workflows/`; a composite action's own `uses:`
    # pins are only scanned where its directory is listed.
    directories:
      - "/"
      - "/.github/actions/*"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(actions): ⬆️"

    # Actions resolves a `uses:` ref as a literal git tag, so a compromised
    # release reaches CI the moment it is tagged. Every ref is pinned to an
    # exact vX.Y.Z, which makes each bump a reviewable PR, and this gives the
    # registry 7 days to yank one first.
    cooldown:
      default-days: 7

    # Majors stay ungrouped, so a breaking action bump gets its own review.
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "🤖 ci"
      - "📦 dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps): ⬆️"
      prefix-development: "chore(deps-dev): ⬆️"

    # Past pnpm's `minimumReleaseAge` floor (pnpm-workspace.yaml), so the
    # frozen-lockfile install in CI accepts the bump instead of rejecting a
    # too-new version.
    cooldown:
      default-days: 7

    # Majors stay ungrouped, so a breaking bump gets its own review.
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"

    # Pins AGENTS.md sets on purpose; only the ignored update types are held,
    # so smaller bumps still flow.
    ignore:
      # Tracks the `engines.node` floor (22), so the typecheck rejects an API a
      # supported Node doesn't have.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

      # Stays on 6.x until typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

      # The `typescript-<major.minor>` aliases are consumer-test fixtures, each
      # pinned to one release line; only patches within it are wanted.
      - dependency-name: "typescript-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "📦 dependencies"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"

  # The research harness's own libraries (`research/`), a separate pnpm root.
  - package-ecosystem: "npm"
    directory: "/research"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"

    # Past `research/pnpm-workspace.yaml`'s `minimumReleaseAge` floor.
    cooldown:
      default-days: 7

    # One PR per week for every research bump, majors included: a library's
    # new major is a result to record, not a breaking change to the package.
    groups:
      research:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"

  # The research harness's pinned images: `image:` lines in
  # `research/compose.yaml` here, and each Dockerfile's `FROM` below.
  - package-ecosystem: "docker-compose"
    directory: "/research"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"

    # A tag can be re-pushed with new contents; waiting 7 days matches the npm
    # moratorium.
    cooldown:
      default-days: 7

    groups:
      research-images:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"

  # Each research Dockerfile's `FROM`; the Hermes CLI tarball its Dockerfile
  # downloads can't be tracked, so that one is bumped by hand.
  - package-ecosystem: "docker"
    directories:
      - "/research/docker/c"
      - "/research/docker/debian"
      - "/research/docker/hermes"
      - "/research/docker/node"
      - "/research/docker/powershell"
      - "/research/docker/ruby"
      - "/research/docker/swift"
      - "/research/docker/xml-schema"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"
    cooldown:
      default-days: 7

    # One PR per week for every Dockerfile's base image.
    groups:
      research-dockerfiles:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"

  # The Ruby adapter's gems, locked in `research/docker/ruby/Gemfile.lock`.
  - package-ecosystem: "bundler"
    directory: "/research/docker/ruby"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"
    cooldown:
      default-days: 7
    groups:
      research-gems:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"

  # The JVM adapter's Gradle image and its formatters' Temurin images; the
  # Checkstyle and ktfmt jars are bumped by hand (see their Dockerfiles).
  - package-ecosystem: "docker"
    directories:
      - "/research/docker/checkstyle"
      - "/research/docker/jvm"
      - "/research/docker/ktfmt"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"
    cooldown:
      default-days: 7
    groups:
      research-jvm-images:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"

  # The JVM adapter's libraries and Kotlin plugin. Maven has no release-age
  # floor, so this cooldown is what holds them 7 days back.
  - package-ecosystem: "gradle"
    directory: "/research/adapters/jvm"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"
    cooldown:
      default-days: 7

    # Majors included, like the Node adapter's libraries: a new major is a
    # result to record, not a breaking change to the package.
    groups:
      research-jvm:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"

  # The .NET, Go, and Rust adapters' images, each with its adapter compiled in.
  - package-ecosystem: "docker"
    directories:
      - "/research/docker/dotnet"
      - "/research/docker/go"
      - "/research/docker/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"
    cooldown:
      default-days: 7
    groups:
      research-compiled-images:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"

  # The .NET adapter's tool manifest (`.config/dotnet-tools.json`): CSharpier.
  - package-ecosystem: "nuget"
    directory: "/research/adapters/dotnet"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"
    cooldown:
      default-days: 7
    labels:
      - "📦 dependencies"

  # The Rust adapter's crates: `serde_json` and what it locks. Cargo has no
  # release-age floor, so this cooldown is what holds them 7 days back.
  - package-ecosystem: "cargo"
    directory: "/research/adapters/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"
    cooldown:
      default-days: 7
    groups:
      research-crates:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"

  # The database adapters' image and the Firebase emulators' image.
  - package-ecosystem: "docker"
    directories:
      - "/research/docker/db"
      - "/research/docker/firebase"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"
    cooldown:
      default-days: 7
    groups:
      research-database-images:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"

  # The database adapters' drivers, pinned with hashes in
  # `research/docker/db/requirements.txt`.
  - package-ecosystem: "pip"
    directory: "/research/docker/db"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"

    # PyPI has no release-age floor of its own; this is the moratorium.
    cooldown:
      default-days: 7

    groups:
      research-drivers:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"

  # The XML Schema adapter's libraries, pinned with hashes in
  # `research/docker/xml-schema/requirements.txt`.
  - package-ecosystem: "pip"
    directory: "/research/docker/xml-schema"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"

    # PyPI has no release-age floor of its own; this is the moratorium.
    cooldown:
      default-days: 7

    groups:
      research-xml-schema:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"

  # The Firebase emulators' CLI (`research/docker/firebase/`), its own pnpm
  # root.
  - package-ecosystem: "npm"
    directory: "/research/docker/firebase"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    assignees:
      - jjloneman
    commit-message:
      prefix: "chore(deps-dev): ⬆️"

    # Past its `pnpm-workspace.yaml`'s `minimumReleaseAge` floor.
    cooldown:
      default-days: 7

    groups:
      research-firebase:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"
