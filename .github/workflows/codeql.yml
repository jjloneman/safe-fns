name: 🔐 CodeQL

on:
  pull_request: {}
  push:
    branches: [main]

  # Weekly, so a newly published query catches code that hasn't changed.
  schedule:
    # 9:00 AM every Monday, New York time.
    #
    # ┌───────────── minute (0)
    # │ ┌───────────── hour (9)
    # │ │ ┌───────────── day of the month (any)
    # │ │ │ ┌───────────── month (any)
    # │ │ │ │ ┌───────────── day of the week (Monday)
    # │ │ │ │ │
    - cron: "0 9 * * MON"
      timezone: "America/New_York"

# Nothing by default; the job grants only what it uses.
permissions: {}

jobs:
  analyze:
    name: 🔐 Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # `build-mode: none` reads the source directly; TypeScript needs no build.
      - uses: github/codeql-action/init@v4.38.1
        with:
          build-mode: none
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4.38.1
        with:
          category: /language:javascript-typescript
