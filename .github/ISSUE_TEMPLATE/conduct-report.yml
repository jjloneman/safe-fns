name: 🤝 Conduct report
description: Report behavior that breaks the code of conduct. Reports are public.
labels:
  - 📥 needs-triage
body:
  - attributes:
      value: |
        GitHub has no private messages, so this report is public. See the [code of conduct](https://github.com/jjloneman/safe-fns/blob/main/CODE_OF_CONDUCT.md) for how reports are handled.
    type: markdown
  - attributes:
      description: A link to the issue, pull request, or comment.
      label: 🔗 Where it happened
    id: location
    type: input
    validations:
      required: true
  - attributes:
      label: 📝 What happened
    id: description
    type: textarea
    validations:
      required: true
